<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuit G Viewer</title>
<style>
:root{--bg:#101112;--pn:#1a1b1d;--ln:#35373b;--fg:#eceae4;--mut:#8a8a85;--sp:#38bdf8;--lg:#ffc928;--lo:#7f8ea3;--ac:#ff3b4a}
*{box-sizing:border-box}
body{margin:0;padding:10px;background:var(--bg);color:var(--fg);font:14px/1.4 "Hiragino Sans","Helvetica Neue",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:10px}
select,input[type=file]{font:inherit;color:var(--fg);background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:6px}
select:focus-visible,input:focus-visible{outline:3px solid var(--ac)}
label{color:var(--mut);font-size:13px}
#st{color:var(--mut);font-size:13px}
main{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){main{grid-template-columns:380px minmax(0,1fr)}}
.col{display:grid;gap:10px;align-content:start}
.p{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:8px}
.t{color:var(--mut);font-size:12px;margin-bottom:4px}
canvas{display:block;width:100%}
#map,#rs{aspect-ratio:4/3}#gg{aspect-ratio:1}#gr{height:470px;touch-action:none;cursor:crosshair}
.zb{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.zb button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:4px;padding:4px 10px}
.zb button:focus-visible{outline:3px solid var(--ac)}
.hint{color:var(--mut);font-size:12px;margin-top:4px}
#ro{font-variant-numeric:tabular-nums;font-size:15px;min-height:1.4em;margin-top:6px}
</style>
</head>
<body>
<header>
  <input type="file" id="f" accept=".csv,text/csv" aria-label="CSVファイルを選択">
  <label>ラップ <select id="lap"><option value="all">全て</option></select></label>
  <label>横軸 <select id="xm"><option value="d">距離</option><option value="t">時間</option></select></label>
  <label>平滑化 <input type="range" id="sm" min="1" max="31" step="2" value="9"></label>
  <span id="st">CSVを選ぶと表示します。</span>
</header>
<main>
  <div class="col">
    <div class="p"><div class="t">走行ライン（色=横Gの大きさ：青→赤）</div><canvas id="map"></canvas></div>
    <div class="p"><div class="t">Gサークル（横G：左右／前後G：上下）</div><canvas id="gg"></canvas></div>
    <div class="p"><div class="t">横G と ロール角（点の傾き＝ロール量）</div><canvas id="rs"></canvas></div>
  </div>
  <div class="p"><div class="t">車速（青）／横G（黄）／前後G（灰）／ロール（桃）／ピッチ（紫）　横軸=距離または時間　※グラフをなぞると地図とGサークルが連動</div>
    <div class="zb"><button id="zi">横 拡大</button><button id="zo">横 縮小</button><button id="yi">縦 拡大</button><button id="yo">縦 縮小</button><button id="z0">全体表示</button></div>
    <canvas id="gr"></canvas><div id="ro"></div>
    <div class="hint">PC: ホイール=横ズーム／Shift+ホイール=縦ズーム／ドラッグ=移動　スマホ: 2本指=ズーム・移動、1本指=カーソル</div></div>
</main>
<script>
const $=id=>document.getElementById(id);
let R=[],sel=[],ci=0,Rg=1.5,Rr=2,X1=1,mp=null;

function ctx(c){const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);return[g,w,h];}

function parse(txt){
  const L=txt.replace(/^\ufeff/,'').trim().split(/\r?\n/), h=L[0].split(',');
  R=L.slice(1).map(l=>{const c=l.split(','),o={};h.forEach((k,i)=>o[k]=c[i]);
    const n=k=>o[k]===''||o[k]==null?NaN:+o[k];
    return{t:n('epoch_ms'),lat:n('lat_g'),lon:n('lon_g'),la:n('gps_lat'),lo:n('gps_lon'),v:n('speed_kmh'),gt:o.gps_time,lap:n('lap')||0,roll:n('roll_deg'),pitch:n('pitch_deg')};
  }).filter(r=>isFinite(r.t)&&isFinite(r.lat));
  let d=0;R.forEach((r,i)=>{if(i){d+=(isFinite(r.v)?r.v:0)/3.6*(r.t-R[i-1].t)/1000;}r.d=d;});
  const laps=[...new Set(R.map(r=>r.lap))].sort((a,b)=>a-b);
  $('lap').innerHTML='<option value="all">全て</option>'+laps.map(n=>'<option value="'+n+'">'+(n===0?'計測前（ラップ0）':'ラップ '+n)+'</option>').join('');
  smooth();ci=0;$('xm').value=R.length&&R[R.length-1].d<100?'t':'d';update();
}
function smooth(){
  const k=(+$('sm').value)>>1,K=['lat','lon','roll','pitch'],S=K.map(()=>[0]);
  R.forEach((r,i)=>K.forEach((q,j)=>S[j].push(S[j][i]+(isFinite(r[q])?r[q]:0))));
  R.forEach((r,i)=>{const a=Math.max(0,i-k),b=Math.min(R.length,i+k+1);
    [r.sl,r.so,r.sr,r.sp]=S.map(t=>(t[b]-t[a])/(b-a));
    if(!isFinite(r.roll))r.sr=r.sp=NaN;});
}
function update(keep){
  const L=$('lap').value;
  sel=R.filter(r=>L==='all'||r.lap==L);
  if(!sel.length){draw();return;}
  const d0=sel[0].d,t0=sel[0].t,tm=$('xm').value==='t';let m=0,vm=0,pk=0,mo=0;
  sel.forEach(r=>{r.x=tm?(r.t-t0)/1000:r.d-d0;m=Math.max(m,Math.abs(r.sl),Math.abs(r.so));pk=Math.max(pk,Math.abs(r.sl));mo=Math.max(mo,Math.abs(r.sr)||0,Math.abs(r.sp)||0);if(r.v>vm)vm=r.v;});
  X1=sel[sel.length-1].x||1;if(!keep){vx0=0;vx1=X1;ysc=1;}Rg=Math.max(1.5,Math.ceil(m*2)/2);Rr=Math.max(2,Math.ceil(mo));ci=Math.min(ci,sel.length-1);
  $('st').textContent='最大横G '+pk.toFixed(2)+' G ／ 最高速 '+vm.toFixed(0)+' km/h ／ 距離 '+(X1/1000).toFixed(2)+' km';
  draw();
}

function drawMap(){
  const[g,w,h]=ctx($('map'));mp=null;
  const F=[];let lg=null;
  for(const r of sel){
    if(!isFinite(r.la))continue;
    if(r.gt!==lg){F.push({la:r.la,lo:r.lo,g:0});lg=r.gt;}
    const f=F[F.length-1];f.g=Math.max(f.g,Math.abs(r.sl));
  }
  if(F.length<2)return;
  const la0=F[0].la,lo0=F[0].lo,kx=Math.cos(la0*Math.PI/180)*111320,ky=110540;
  const P=F.map(f=>[(f.lo-lo0)*kx,(f.la-la0)*ky]);
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  P.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);});
  const s=Math.min((w-24)/((x1-x0)||1),(h-24)/((y1-y0)||1)),ox=(w-(x1-x0)*s)/2-x0*s,oy=(h+(y1-y0)*s)/2+y0*s;
  mp=r=>[(r.lo-lo0)*kx*s+ox,oy-(r.la-la0)*ky*s];
  g.lineWidth=4;g.lineCap='round';
  for(let i=0;i<P.length-1;i++){
    const t=Math.min(F[i].g/1.5,1);
    g.strokeStyle='hsl('+(205-205*t)+',90%,55%)';
    g.beginPath();g.moveTo(P[i][0]*s+ox,oy-P[i][1]*s);g.lineTo(P[i+1][0]*s+ox,oy-P[i+1][1]*s);g.stroke();
  }
  const r=sel[ci];
  if(r&&isFinite(r.la)){const[X,Y]=mp(r);g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(X,Y,7,0,7);g.stroke();}
}

function drawGG(){
  const[g,w]=ctx($('gg')),m=w/2,s=(m-14)/Rg;
  g.strokeStyle='#35373b';g.fillStyle='#8a8a85';g.font='11px sans-serif';g.lineWidth=1;
  for(let i=0.5;i<=Rg;i+=0.5){g.beginPath();g.arc(m,m,i*s,0,7);g.stroke();g.fillText(i.toFixed(1),m+i*s-16,m-3);}
  g.beginPath();g.moveTo(m,0);g.lineTo(m,w);g.moveTo(0,m);g.lineTo(w,m);g.stroke();
  const st=Math.max(1,Math.floor(sel.length/4000));
  for(let i=0;i<sel.length;i+=st){const r=sel[i];g.fillStyle='hsla('+((r.lap*70+200)%360)+',85%,60%,.55)';g.fillRect(m+r.sl*s-1,m-r.so*s-1,2.5,2.5);}
  const r=sel[ci];
  if(r){g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(m+r.sl*s,m-r.so*s,7,0,7);g.stroke();}
}

const GL=44,GR=8;
let vx0=0,vx1=1,ysc=1;
const nice=(span,n)=>{const r=span/n,p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*p;};
function idx(x){let a=0,b=sel.length-1;while(a<b){const m=(a+b)>>1;if(sel[m].x<x)a=m+1;else b=m;}return a;}
function drawGr(){
  const[g,w,h]=ctx($('gr'));
  if(!sel.length)return;
  const hasO=sel.some(r=>isFinite(r.sr)),n=hasO?3:2,T=6,ph=(h-16-T)/n,pw=w-GL-GR;
  const y0=i=>T+i*ph,y1=i=>T+(i+1)*ph-10;
  const py=(i,v,lo,hi)=>y1(i)-(v-lo)/(hi-lo)*(y1(i)-y0(i));
  let vm=0;sel.forEach(r=>{if(r.v>vm)vm=r.v;});vm=Math.ceil((vm||50)/50)*50;
  const vh=vm/ysc,Gh=Rg/ysc,Rh=Rr/ysc,span=vx1-vx0,px=x=>GL+(x-vx0)/span*pw;
  g.font='11px sans-serif';g.lineWidth=1;g.strokeStyle='#35373b';g.fillStyle='#8a8a85';
  const grid=(i,lo,hi,fmt)=>{const st=nice(hi-lo,4);
    for(let k=Math.ceil(lo/st);k*st<=hi+1e-9;k++){const v=+(k*st).toFixed(3),y=py(i,v,lo,hi);
      g.beginPath();g.moveTo(GL,y);g.lineTo(w-GR,y);g.stroke();g.fillText(fmt(v),4,y+4);}};
  grid(0,0,vh,v=>v);grid(1,-Gh,Gh,v=>v+'G');if(hasO)grid(2,-Rh,Rh,v=>v+'°');
  const tm=$('xm').value==='t',xs=nice(span,6);
  for(let k=Math.ceil(vx0/xs);k*xs<=vx1;k++){const x=k*xs;g.fillText((+x.toFixed(2))+(tm?'s':'m'),px(x)-10,h-4);}
  const i0=Math.max(0,idx(vx0)-1),i1=Math.min(sel.length-1,idx(vx1)+1),st=Math.max(1,Math.floor((i1-i0)/(pw*1.5)));
  const ln=(i,col,f,lo,hi)=>{g.save();g.beginPath();g.rect(GL,y0(i),pw,y1(i)-y0(i)+2);g.clip();
    g.strokeStyle=col;g.lineWidth=1.6;g.beginPath();let on=false;
    for(let k=i0;k<=i1;k+=st){const r=sel[k],y=py(i,f(r),lo,hi);if(!isFinite(y)){on=false;continue;}
      on?g.lineTo(px(r.x),y):g.moveTo(px(r.x),y);on=true;}
    g.stroke();g.restore();};
  ln(1,'#7f8ea3',r=>r.so,-Gh,Gh);ln(0,'#38bdf8',r=>r.v,0,vh);ln(1,'#ffc928',r=>r.sl,-Gh,Gh);
  if(hasO){ln(2,'#ff5d8f',r=>r.sr,-Rh,Rh);ln(2,'#a78bfa',r=>r.sp,-Rh,Rh);}
  const r=sel[ci];
  if(r){if(r.x>=vx0&&r.x<=vx1){g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(px(r.x),0);g.lineTo(px(r.x),h-16);g.stroke();}
    $('ro').textContent=r.x.toFixed(tm?1:0)+(tm?' s':' m')+' ／ '+(isFinite(r.v)?r.v.toFixed(0):'--')+' km/h ／ 横G '+r.sl.toFixed(2)+' ／ 前後G '+r.so.toFixed(2)
      +(hasO?' ／ ロール '+r.sr.toFixed(1)+'° ／ ピッチ '+r.sp.toFixed(1)+'°':'');}
}

function drawRS(){
  const[g,w,h]=ctx($('rs'));
  g.font='11px sans-serif';g.fillStyle='#8a8a85';
  const P=sel.filter(r=>isFinite(r.sr));
  if(P.length<10){g.fillText('ロール角データなし（新しいロガーで記録したCSVが必要です）',10,20);return;}
  const L=34,B=18,T=8,Rm=8,pw=w-L-Rm,ph=h-T-B,sx=pw/(2*Rg),sy=ph/(2*Rr),cx=L+pw/2,cy=T+ph/2;
  g.strokeStyle='#35373b';g.lineWidth=1;
  g.beginPath();g.moveTo(L,cy);g.lineTo(w-Rm,cy);g.moveTo(cx,T);g.lineTo(cx,h-B);g.stroke();
  g.fillText('横G -'+Rg,L,h-4);g.fillText('+'+Rg,w-Rm-26,h-4);g.fillText('+'+Rr+'°',2,T+8);g.fillText('-'+Rr+'°',2,h-B);
  let n=0,Sx=0,Sy=0,Sxx=0,Sxy=0,Syy=0;
  const st=Math.max(1,Math.floor(P.length/3000));
  P.forEach((r,i)=>{n++;Sx+=r.sl;Sy+=r.sr;Sxx+=r.sl*r.sl;Sxy+=r.sl*r.sr;Syy+=r.sr*r.sr;
    if(i%st===0){g.fillStyle='rgba(255,93,143,.45)';g.fillRect(cx+r.sl*sx-1,cy-r.sr*sy-1,2.5,2.5);}});
  const den=n*Sxx-Sx*Sx;
  if(den>0){
    const k=(n*Sxy-Sx*Sy)/den,c=(Sy-k*Sx)/n,r2=Math.pow(n*Sxy-Sx*Sy,2)/(den*(n*Syy-Sy*Sy)||1);
    g.strokeStyle='#ffc928';g.lineWidth=2;g.beginPath();
    g.moveTo(cx-Rg*sx,cy-(c-k*Rg)*sy);g.lineTo(cx+Rg*sx,cy-(c+k*Rg)*sy);g.stroke();
    g.fillStyle='#eceae4';g.font='13px sans-serif';
    g.fillText('ロール量 '+Math.abs(k).toFixed(2)+' °/G　R² '+r2.toFixed(2),L+6,T+16);
  }
  const r=sel[ci];
  if(r&&isFinite(r.sr)){g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(cx+r.sl*sx,cy-r.sr*sy,6,0,7);g.stroke();}
}
function draw(){drawMap();drawGG();drawGr();drawRS();}

const gr=$('gr'),pt=new Map();let drag=null,pinch=null;
const fracX=cx=>(cx-gr.getBoundingClientRect().left-GL)/(gr.clientWidth-GL-GR);
function seek(e){
  if(!sel.length)return;
  const x=vx0+fracX(e.clientX)*(vx1-vx0);
  ci=idx(Math.min(Math.max(x,vx0),vx1));draw();
}
function clampView(){const sp=vx1-vx0;if(vx0<0){vx0=0;vx1=sp;}if(vx1>X1){vx1=X1;vx0=Math.max(0,X1-sp);}}
function zoomAt(f,k){
  if(!sel.length)return;
  const sp=vx1-vx0,ns=Math.min(X1,Math.max(X1/1000,sp*k)),c=vx0+f*sp;
  vx0=c-f*ns;vx1=vx0+ns;clampView();draw();
}
function panBy(dx){
  if(!sel.length)return;
  const sp=vx1-vx0,d=dx/(gr.clientWidth-GL-GR)*sp;vx0-=d;vx1-=d;clampView();draw();
}
const setY=k=>{ysc=Math.min(20,Math.max(.25,ysc*k));draw();};
gr.addEventListener('wheel',e=>{e.preventDefault();const k=Math.exp((e.deltaY||e.deltaX)*0.0015);
  if(e.shiftKey)setY(1/k);else zoomAt(fracX(e.clientX),k);},{passive:false});
gr.onpointerdown=e=>{
  gr.setPointerCapture(e.pointerId);pt.set(e.pointerId,e.clientX);
  if(e.pointerType==='mouse'){drag=e.clientX;}
  else if(pt.size===2){const v=[...pt.values()];pinch={d:Math.abs(v[0]-v[1]),c:(v[0]+v[1])/2};}
  else seek(e);
};
gr.onpointermove=e=>{
  if(!pt.has(e.pointerId)){seek(e);return;}            // マウスのホバー=カーソル移動
  pt.set(e.pointerId,e.clientX);
  if(e.pointerType==='mouse'){panBy(e.clientX-drag);drag=e.clientX;}
  else if(pt.size===2&&pinch){const v=[...pt.values()],d=Math.abs(v[0]-v[1]),c=(v[0]+v[1])/2;
    zoomAt(fracX(c),pinch.d/Math.max(d,1));panBy(c-pinch.c);pinch={d,c};}
  else seek(e);
};
gr.onpointerup=gr.onpointercancel=e=>{pt.delete(e.pointerId);drag=null;pinch=null;};
$('zi').onclick=()=>zoomAt(.5,.6);$('zo').onclick=()=>zoomAt(.5,1/.6);
$('yi').onclick=()=>setY(1.5);$('yo').onclick=()=>setY(1/1.5);
$('z0').onclick=()=>{vx0=0;vx1=X1;ysc=1;draw();};
$('f').onchange=async e=>{const f=e.target.files[0];if(f)parse(await f.text());};
$('xm').onchange=()=>update();
$('lap').onchange=()=>{ci=0;update();};
$('sm').oninput=()=>{if(R.length){smooth();update(true);}};
addEventListener('resize',draw);
</script>
</body>
</html>
